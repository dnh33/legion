<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Legion</title>
<!-- Direction 2, Retouch in blackletter: Direction 1 with one variable changed: the name is the Grenze Gotisch wordmark the app's title bar and the README use (outlined paths, so no font load and no CSP change). -->
<style>
  :root{--bg:#0b0d10;--line:#1e232b;--line-strong:#2a313b;--surface:#12151a;--text:#e6e9ef;--muted:#8a93a3;
    --accent:#7CFFB2;--accent-ink:#04140b;--danger:#FF6B6B;--cream:#f1e8cd;--gold:#caa64a;
    --text-2:#b3bac6;--mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;--serif:Georgia,"Times New Roman",serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none}
  body{font-family:var(--mono);position:relative;-webkit-app-region:drag;transition:opacity .4s ease}
  body.fade{opacity:0}
  .frame{position:absolute;inset:0;background:
    radial-gradient(420px 320px at 125px 140px,rgba(124,255,178,.13),transparent 70%),
    radial-gradient(500px 360px at 100% 100%,rgba(179,32,47,.10),transparent 70%),var(--bg)}
  /* the border sits above the art so the bust never paints over it */
  .edge{position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:3}
  /* same crop as v0.2.5-c; a longer two-stop feather instead of a 95 px ramp, so the painted ground melts into the frame */
  .hero{position:absolute;left:0;top:0;width:268px;height:100%;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,#000 52%,rgba(0,0,0,.55) 76%,transparent 100%);mask-image:linear-gradient(90deg,#000 52%,rgba(0,0,0,.55) 76%,transparent 100%)}
  .hero img{position:absolute;width:580px;left:-165px;top:-42px}
  /* green light over the painted halo (SVG halo centre 300,188 -> 125,140 here); opacity only, its own layer */
  .halo{position:absolute;left:5px;top:20px;width:240px;height:240px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(124,255,178,.16),rgba(124,255,178,.05) 45%,transparent 68%);animation:breathe 3.2s ease-in-out infinite;will-change:opacity}
  @keyframes breathe{50%{opacity:.5}}
  :root{--col-l:272px;--col-r:32px;--col-top:56px}
  h1{flex:none;height:60px;color:var(--cream);line-height:0}
  .wm{display:block;height:60px;width:auto;filter:drop-shadow(0 0 12px rgba(124,255,178,.22))}
  /* ---- shared text column (same in every sketch) ---- */
  .right{position:absolute;left:var(--col-l);right:var(--col-r);top:0;bottom:0;display:flex;flex-direction:column;padding:12px 0 28px}
  /* give above the title and between tagline and log: they shrink first, and only when a message is too long for the column */
  .right::before{content:"";flex:0 1000 var(--col-top)}
  .gap{flex:0 1000 28px;min-height:6px}
  .rule{flex:none;height:1px;width:120px;margin:14px 0 12px;background:linear-gradient(90deg,var(--gold),transparent)}
  .tag{flex:none;font:italic 15px/20px var(--serif);color:var(--muted);letter-spacing:.06em}
  .log{flex:none;height:76px;font-size:12px;line-height:19px;color:var(--muted);overflow:hidden}
  /* hanging indent: wrapped lines start under the text, not under the prompt */
  .log div{padding-left:2ch;text-indent:-2ch;overflow-wrap:anywhere;opacity:0;animation:in .3s forwards}
  .log div::before{content:"> ";color:var(--accent)}
  /* an error reads in one colour (red), with a hanging indent so wrapped lines line up under the text */
  .log div.err{color:var(--danger);line-height:16px;white-space:normal}
  .log div.err::before{color:var(--danger)}
  /* error: the log keeps its place under the tagline and grows; past the column it scrolls (and can, outside the drag region) */
  .log:has(.err){height:auto;flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-app-region:no-drag;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  body:has(.err) .right{padding-bottom:14px}
  @keyframes in{to{opacity:1}}
  .caret{display:inline-block;width:7px;height:12px;background:var(--accent);vertical-align:-2px;margin-left:3px;text-indent:0;animation:blink 1.06s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .btns{display:none;flex:none;gap:10px;margin-top:10px;-webkit-app-region:no-drag}
  .btns.show{display:flex}
  button{font:12px/1 var(--mono);color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px 14px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* ---- end shared column ---- */
  /* the sweep moves by transform (compositor), not background-position */
  .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;overflow:hidden;z-index:4}
  .bar::before{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.6s linear infinite;will-change:transform}
  .bar.stop{display:none}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){
    .halo,.caret,.bar::before,.log div{animation:none}
    body{transition:none}
    .log div{opacity:1}
    .bar::before{left:30%;opacity:.5}
  }
</style></head>
