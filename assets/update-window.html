<title>Updating Legion</title>
<!-- The one look of the update: the "Updating Legion" window the helper starts, and the small window a reopened Legion shows while an update finishes. Driven from outside by window.updateWindow.render(model); no preload, no node. -->
<style>
  :root{--bg:#0b0d10;--surface:#12151a;--line:#1e232b;--line-strong:#2a313b;--text:#e6e9ef;--text-2:#b3bac6;--muted:#8a93a3;
    --accent:#7CFFB2;--accent-ink:#04140b;--danger:#FF6B6B;--cream:#f1e8cd;--track:#1a1f27;
    --mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;--sans:"Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme:light){:root{--bg:#f6f4ee;--surface:#ffffff;--line:#e3dfd3;--line-strong:#cfc9b8;--text:#1b1f26;--text-2:#454c58;--muted:#5d6574;
    --accent:#0d7a45;--accent-ink:#ffffff;--danger:#b42323;--cream:#2a2418;--track:#e6e1d3}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none}
  body{font-family:var(--sans);-webkit-app-region:drag;border:1px solid var(--line)}
  .wrap{height:100%;display:flex;flex-direction:column;padding:26px 30px 22px}
  /* the steps and the message scroll when the screen is too small for them (a laptop, a large zoom); the title, the buttons and the footer never leave the window */
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-app-region:no-drag;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  .inner{display:flow-root}
  .wm{display:block;height:26px;width:auto;color:var(--cream);flex:none;align-self:flex-start}
  h1{font-size:19px;line-height:1.25;font-weight:600;margin-top:18px;text-wrap:balance}
  .sub{font:12px/1.4 var(--mono);color:var(--muted);margin-top:4px;min-height:17px}
  ol{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:2px}
  li{display:flex;align-items:center;gap:12px;min-height:30px;font-size:14px;color:var(--muted);transition:color .25s ease}
  li.done{color:var(--text-2)} li.active{color:var(--text);font-weight:600} li.failed{color:var(--danger);font-weight:600}
  .mark{flex:none;width:18px;height:18px;display:grid;place-items:center}
  .mark svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  li.done .mark{color:var(--accent)} li.active .mark{color:var(--accent)} li.pending .mark{color:var(--line-strong)}
  .spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{margin-top:16px;height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative;flex:none}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px;transition:width .4s ease}
  .bar.sweep i{width:35%;animation:sweep 1.5s ease-in-out infinite}
  .bar.none{visibility:hidden}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
  .msg{margin-top:14px;font-size:13px;line-height:1.5;color:var(--text-2);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;-webkit-app-region:no-drag}
  .msg.failed{color:var(--text)}
  .btns{display:none;flex:none;gap:10px;margin-top:14px;-webkit-app-region:no-drag}
  .btns.show{display:flex}
  button{font:13px/1 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px 16px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:none}
  :root[data-kbd-nav] button:focus-visible{border-color:var(--accent);background:var(--line)}
  :root[data-kbd-nav] button.primary:focus-visible{background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-ink)}
  .foot{flex:none;padding-top:14px;font-size:12px;color:var(--muted);min-height:30px}
  .foot:empty{display:none}
  @media (prefers-reduced-motion:reduce){.spin,.bar.sweep i{animation:none}.bar.sweep i{width:30%;transform:translateX(120%)}li,.bar i{transition:none}}
</style></head>
