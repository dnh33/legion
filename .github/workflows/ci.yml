name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token, pull_request (never pull_request_target), no secrets used anywhere, and actions pinned to commit SHAs:
# a fork's PR runs with nothing it could leak or write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The suite split by test file (node --test --test-shard, Node >= 20.5) so each OS finishes in a few minutes. Windows is the
  # long pole, so it gets the most shards. macOS (Apple Silicon) runs the POSIX-only tests that skip on win32.
  test:
    name: test ${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, total: 4 }
          - { os: windows-latest, shard: 2, total: 4 }
          - { os: windows-latest, shard: 3, total: 4 }
          - { os: windows-latest, shard: 4, total: 4 }
          - { os: ubuntu-latest, shard: 1, total: 2 }
          - { os: ubuntu-latest, shard: 2, total: 2 }
          - { os: macos-latest, shard: 1, total: 2 }
          - { os: macos-latest, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: node --test --test-shard=${{ matrix.shard }}/${{ matrix.total }} "dist/test/*.test.js"

  # Typecheck (core and UI) and the UI build, once.
  ui:
    name: typecheck + UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui

  # The installer is what Windows users run with Windows PowerShell 5.1 (powershell.exe), from paths with spaces.
  # The unit tests above run under pwsh as well; this job runs the real scripts under 5.1 only.
  installer-windows:
    name: installer (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Windows PowerShell 5.1 is the shell
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'expected Windows PowerShell 5.x' }
      - name: setup.ps1 -DryRun from a source folder and into an install folder that both contain a space
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          robocopy $env:GITHUB_WORKSPACE $src /E /XD .git node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          $inst = Join-Path $env:RUNNER_TEMP 'Legion install x'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$src\scripts\setup.ps1" -DryRun -Yes -NoLaunch -InstallDir $inst
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -DryRun exited $LASTEXITCODE" }
          if (Test-Path -LiteralPath $inst) { throw 'a dry run must not create the install folder' }
      - name: setup.ps1 refuses a foreign folder and a drive root, and deletes nothing
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          $foreign = Join-Path $env:RUNNER_TEMP 'Not Legion'
          New-Item -ItemType Directory -Force -Path "$foreign\Documents" | Out-Null
          Set-Content -LiteralPath "$foreign\Documents\precious.txt" -Value 'keep me'
          foreach ($target in @($foreign, 'C:\', 'C:')) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$src\scripts\setup.ps1" -DryRun -Yes -NoLaunch -InstallDir $target
            if ($LASTEXITCODE -eq 0) { throw "setup.ps1 accepted '$target'" }
          }
          if (-not (Test-Path -LiteralPath "$foreign\Documents\precious.txt")) { throw 'the foreign folder was touched' }
          # GitHub ends a powershell step with "exit $LASTEXITCODE"; the last refusal above left it at 1 on purpose.
          exit 0
      - name: uninstall.ps1 -DryRun on a folder with a space, helper next to it as uninstall.cmd does
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          $inst = Join-Path $env:RUNNER_TEMP 'Legion uninstall x'
          New-Item -ItemType Directory -Force -Path "$inst\scripts" | Out-Null
          Set-Content -LiteralPath "$inst\package.json" -Value '{ "name": "legion" }'
          Set-Content -LiteralPath "$inst\scripts\uninstall.ps1" -Value '#'
          $tmpu = Join-Path $env:RUNNER_TEMP 'legion-uninstall-test'
          New-Item -ItemType Directory -Force -Path $tmpu | Out-Null
          Copy-Item -LiteralPath "$src\scripts\uninstall.ps1" -Destination "$tmpu\uninstall.ps1"
          Copy-Item -LiteralPath "$src\scripts\lib\legion-procs.ps1" -Destination "$tmpu\legion-procs.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$tmpu\uninstall.ps1" -DryRun -Yes -InstallDir $inst
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -DryRun exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath "$inst\package.json")) { throw 'a dry run removed files' }
          # without the helper: a readable error, exit 1
          Remove-Item -LiteralPath "$tmpu\legion-procs.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$tmpu\uninstall.ps1" -DryRun -Yes -InstallDir $inst
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 without the helper, got $LASTEXITCODE" }
          exit 0
      - name: setup-yes.cmd with redirected input fails fast and never waits
        shell: cmd
        run: |
          call setup-yes.cmd -DryRun -InstallDir C:\ < nul
          if %ERRORLEVEL% EQU 0 (echo setup-yes.cmd accepted a drive root & exit /b 1)
          exit /b 0
