name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token, pull_request (never pull_request_target), no secrets used anywhere, and actions pinned to commit SHAs:
# a fork's PR runs with nothing it could leak or write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # The suite split by test file (node --test --test-shard, Node >= 20.5) so each OS finishes in a few minutes. Windows is the
  # long pole, so it gets the most shards. macOS (Apple Silicon) runs the POSIX-only tests that skip on win32.
  test:
    name: test ${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, total: 4 }
          - { os: windows-latest, shard: 2, total: 4 }
          - { os: windows-latest, shard: 3, total: 4 }
          - { os: windows-latest, shard: 4, total: 4 }
          - { os: ubuntu-latest, shard: 1, total: 2 }
          - { os: ubuntu-latest, shard: 2, total: 2 }
          - { os: macos-latest, shard: 1, total: 2 }
          - { os: macos-latest, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      # --test-timeout: a hung test fails with its name after 3 minutes instead of stalling the job until it is cancelled.
      - run: node --test --test-timeout=180000 --test-shard=${{ matrix.shard }}/${{ matrix.total }} "dist/test/*.test.js"

  # Typecheck (core and UI) and the UI build, once.
  ui:
    name: typecheck + UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui

  # The installer is what Windows users run with Windows PowerShell 5.1 (powershell.exe), from paths with spaces.
  # The unit tests above run under pwsh as well; this job runs the real scripts under 5.1 only.
  installer-windows:
    name: installer (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Windows PowerShell 5.1 is the shell
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'expected Windows PowerShell 5.x' }
      - name: setup.ps1 -DryRun from a source folder and into an install folder that both contain a space
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          robocopy $env:GITHUB_WORKSPACE $src /E /XD .git node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          $inst = Join-Path $env:RUNNER_TEMP 'Legion install x'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$src\scripts\setup.ps1" -DryRun -Yes -NoLaunch -InstallDir $inst
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 -DryRun exited $LASTEXITCODE" }
          if (Test-Path -LiteralPath $inst) { throw 'a dry run must not create the install folder' }
      - name: setup.ps1 refuses a foreign folder and a drive root, and deletes nothing
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          $foreign = Join-Path $env:RUNNER_TEMP 'Not Legion'
          New-Item -ItemType Directory -Force -Path "$foreign\Documents" | Out-Null
          Set-Content -LiteralPath "$foreign\Documents\precious.txt" -Value 'keep me'
          foreach ($target in @($foreign, 'C:\', 'C:')) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$src\scripts\setup.ps1" -DryRun -Yes -NoLaunch -InstallDir $target
            if ($LASTEXITCODE -eq 0) { throw "setup.ps1 accepted '$target'" }
          }
          if (-not (Test-Path -LiteralPath "$foreign\Documents\precious.txt")) { throw 'the foreign folder was touched' }
          # GitHub ends a powershell step with "exit $LASTEXITCODE"; the last refusal above left it at 1 on purpose.
          exit 0
      - name: uninstall.ps1 -DryRun on a folder with a space, helper next to it as uninstall.cmd does
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'Legion src'
          $inst = Join-Path $env:RUNNER_TEMP 'Legion uninstall x'
          New-Item -ItemType Directory -Force -Path "$inst\scripts" | Out-Null
          Set-Content -LiteralPath "$inst\package.json" -Value '{ "name": "legion" }'
          Set-Content -LiteralPath "$inst\scripts\uninstall.ps1" -Value '#'
          $tmpu = Join-Path $env:RUNNER_TEMP 'legion-uninstall-test'
          New-Item -ItemType Directory -Force -Path $tmpu | Out-Null
          Copy-Item -LiteralPath "$src\scripts\uninstall.ps1" -Destination "$tmpu\uninstall.ps1"
          Copy-Item -LiteralPath "$src\scripts\lib\legion-procs.ps1" -Destination "$tmpu\legion-procs.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$tmpu\uninstall.ps1" -DryRun -Yes -InstallDir $inst
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -DryRun exited $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath "$inst\package.json")) { throw 'a dry run removed files' }
          # without the helper: a readable error, exit 1
          Remove-Item -LiteralPath "$tmpu\legion-procs.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$tmpu\uninstall.ps1" -DryRun -Yes -InstallDir $inst
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 without the helper, got $LASTEXITCODE" }
          exit 0
      - name: setup-yes.cmd with redirected input fails fast and never waits
        shell: cmd
        run: |
          call setup-yes.cmd -DryRun -InstallDir C:\ < nul
          if %ERRORLEVEL% EQU 0 (echo setup-yes.cmd accepted a drive root & exit /b 1)
          exit /b 0

  # The one-line installers (scripts/install/install.ps1 and install.sh), run from this checkout against the REAL latest release,
  # into a temp folder, never launched. The expected version is read from the same releases/latest redirect, by curl, not by the script.
  install-script-lint:
    name: install scripts (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh parses as POSIX sh and has no carriage returns
        run: |
          sh -n scripts/install/install.sh
          if LC_ALL=C grep -q "$(printf '\r')" scripts/install/install.sh; then echo 'install.sh has CR bytes'; exit 1; fi
          head -n 1 scripts/install/install.sh | grep -qx '#!/bin/sh'
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install/install.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; throw 'install.ps1 has parse errors' }

  install-windows:
    name: install.ps1 (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows PowerShell 5.1, shell: powershell, exe: powershell.exe }
          - { name: PowerShell 7, shell: pwsh, exe: pwsh }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest release version (from the releases/latest redirect)
        shell: pwsh
        run: |
          $h = curl.exe -sSI https://github.com/dnh33/legion/releases/latest
          $loc = ($h | Where-Object { $_ -match '^(?i)location:' } | Select-Object -Last 1)
          if ($loc -notmatch '/releases/tag/v(\S+)') { throw "no version in: $loc" }
          "EXPECTED_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "latest is $($Matches[1])"
      - name: install.ps1 -NoLaunch into a temp folder with a space (${{ matrix.name }})
        shell: ${{ matrix.shell }}
        run: |
          $inst = Join-Path $env:RUNNER_TEMP 'Legion install test'
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File scripts/install/install.ps1 -NoLaunch -InstallDir $inst
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $bi = Get-Content -Raw -LiteralPath (Join-Path $inst 'build-info.json') | ConvertFrom-Json
          if ($bi.version -ne $env:EXPECTED_VERSION) { throw "installed version '$($bi.version)', expected '$($env:EXPECTED_VERSION)'" }
          if (-not (Test-Path -LiteralPath (Join-Path $inst 'runtime\electron\electron.exe'))) { throw 'electron.exe is missing' }
          if (@(Get-ChildItem -LiteralPath ([System.IO.Path]::GetTempPath()) -Directory -Filter 'legion-install-*').Count -ne 0) { throw 'the installer left its temp folder behind' }
      - name: Windows PowerShell 5.1 only, the documented options form (a script block, as with irm | iex), updating the same folder
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $inst = Join-Path $env:RUNNER_TEMP 'Legion install test'
          & ([scriptblock]::Create((Get-Content -Raw -LiteralPath scripts/install/install.ps1))) -NoLaunch -Version $env:EXPECTED_VERSION -InstallDir $inst
          $bi = Get-Content -Raw -LiteralPath (Join-Path $inst 'build-info.json') | ConvertFrom-Json
          if ($bi.version -ne $env:EXPECTED_VERSION) { throw "installed version '$($bi.version)', expected '$($env:EXPECTED_VERSION)'" }

  install-unix:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: install.sh --no-launch into a temp folder
        env:
          # the workflow default skips the Electron download; the installer must do what a user's install does
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: |
          expected=$(curl -sSI https://github.com/dnh33/legion/releases/latest | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -n 1)
          expected=${expected##*/releases/tag/v}
          echo "latest is $expected"
          dir="$RUNNER_TEMP/legion-install-test"
          sh scripts/install/install.sh --no-launch --dir "$dir"
          test -f "$dir/dist/src/electron/main.js"
          test -f "$dir/dist-ui/index.html"
          test -x "$HOME/.local/bin/legion"
          grep -q "$dir" "$HOME/.local/bin/legion"
          node -e 'const v=require(process.argv[1]).version; if (v!==process.argv[2]) { console.error("installed "+v+", expected "+process.argv[2]); process.exit(1); }' "$dir/package.json" "$expected"
      - name: install.sh again updates the same folder in place
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: |
          sh scripts/install/install.sh --no-launch --dir "$RUNNER_TEMP/legion-install-test"
          test -f "$RUNNER_TEMP/legion-install-test/dist/src/electron/main.js"
