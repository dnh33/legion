name: Release build

# Builds the Windows release package on a `v*` tag push, or by hand (with an optional ref, for a dry run): the `build` job uploads
# ONE workflow artifact (both zips, the UNSIGNED update manifest, SHA256SUMS.txt and the two one-line installers) and the `attest`
# job records signed SLSA build provenance for that artifact on GitHub's attestations API. That is all it does.
# Signing, the pre-flight gate, verification and publishing stay on the maintainer's PC (docs/SHIPPING.md): the signing key never
# comes here, the workflow uses no secrets, it never creates or uploads a release, and only the `attest` job holds write scopes
# (id-token, attestations and artifact-metadata, the three actions/attest documents). The `build` job stays read-only.
#
# Runner: windows-latest. build-package.mjs builds the Windows x64 package and refuses any other platform (it ships the Windows
# electron.exe and the SDK's win32 claude.exe from the dependency install). Node is pinned to the maintainer's PC version: the zips
# use fixed entry dates, so their bytes follow only the inputs and the Node/zlib that deflates them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty = the branch you run this from). A dry run; nothing is published.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build Windows package
    if: github.repository == 'dnh33/legion'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      # The artifact name (legion-<v>-release or legion-<v>-DRYRUN-<sha7>), so the attest job downloads exactly this build.
      artifact: ${{ steps.v.outputs.artifact }}
    env:
      # GitHub sets CI=true, and scripts/postinstall.mjs skips the Electron download when CI or ELECTRON_SKIP_BINARY_DOWNLOAD is
      # set. The package ships that Electron, so both are cleared here.
      CI: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full commit history without file contents, so a tag build can prove its commit is on main.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # No npm cache: a release is built from a clean dependency install, never from a restored cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
      - name: Version, tag and release notes
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($v -notmatch '^(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})(-[a-z])?$') { throw "package.json version '$v' is not a release version" }
          if ($env:EVENT -eq 'push') {
            if ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -cne "v$v") { throw "the tag '$($env:REF_NAME)' does not match package.json version $v (expected v$v)" }
            # A release is built only from a commit that is on main (reviewed and merged), never from a tag on a side branch.
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'the tagged commit is not on main: merge first, then tag the merged commit' }
          }
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'could not read the commit' }
          # Only a tag build is named as a release; a build run by hand says DRYRUN and its commit in its name.
          $artifact = if ($env:EVENT -eq 'push') { "legion-$v-release" } else { "legion-$v-DRYRUN-$($sha.Substring(0, 7))" }
          "PKG=$(Join-Path $env:RUNNER_TEMP 'legion-pkg')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notes = "docs/release-notes/$v.txt"
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            "notes=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($env:EVENT -eq 'push') {
            throw "$notes is missing: commit the release notes before tagging"
          } else {
            Write-Host "::warning::$notes is missing: building WITHOUT release notes (a dry run). release-preflight will refuse this manifest until notes are added on the PC."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "building $v"
      - run: npm ci
      - run: npm run build
      - name: Build the package (outside the checkout)
        run: node scripts/build-package.mjs --out "$env:PKG" --skip-build
      - name: Add the one-line installers
        run: |
          Copy-Item -LiteralPath scripts/install/install.ps1 -Destination $env:PKG
          Copy-Item -LiteralPath scripts/install/install.sh -Destination $env:PKG
      - name: Smoke test the built package (launch packaged app, verify health endpoint)
        # Confirms the blank-renderer fix: on CI, the app must stay alive past 45s (single-instance
        # lock holds during relaunch; if broken, electron exits before window creation). This uses
        # the FULL win-x64 package (not the code-only update zip) so the Electron runtime is present.
        env:
          SMOKE_TIMEOUT: 45
          V: ${{ steps.v.outputs.version }}
          # CI-friendly Electron flags: disable GPU, sandbox; run on software renderer
          ELECTRON_DISABLE_GPU: "1"
          ELECTRON_ENABLE_LOGGING: "1"
          ELECTRON_ENABLE_STACK_DUMPING: "1"
        run: |
          Write-Host "=== SMOKE TEST START ==="
          Write-Host "PKG dir: $env:PKG"
          Write-Host "Version: $env:V"
          # List what's in PKG
          Get-ChildItem -LiteralPath $env:PKG | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          $fullZip = (Join-Path $env:PKG "legion-$env:V-win-x64.zip")
          Write-Host "Looking for: $fullZip"
          if (-not (Test-Path $fullZip)) { throw "Full package zip not found at $fullZip" }
          Write-Host "Found zip: $($fullZip) - size: $((Get-Item $fullZip).Length) bytes"
          # Extract to a temporary directory
          $exDir = "$env:RUNNER_TEMP\smoke-extract"
          Write-Host "Extracting to: $exDir"
          Expand-Archive -LiteralPath $fullZip -DestinationPath $exDir -Force
          Write-Host "Extract complete"
          $children = Get-ChildItem -LiteralPath $exDir
          $children | ForEach-Object { Write-Host "  Root child: $($_.Name) (container: $($_.PSIsContainer))" }
          $appRoot = ($children | Where-Object { $_.PSIsContainer } | Select-Object -First 1).FullName
          Write-Host "App root: $appRoot"
          # Find the electron executable inside the package
          $electronExe = Join-Path $appRoot "runtime\electron\electron.exe"
          Write-Host "Electron exe: $electronExe"
          if (-not (Test-Path $electronExe)) { throw "electron.exe not found at $electronExe (full package missing)" }
          Write-Host "Electron exe found, launching with GPU disabled..."
          # Launch Electron with the app directory; CI-friendly flags
          $proc = Start-Process $electronExe -ArgumentList $appRoot, "--disable-gpu", "--disable-software-rasterizer", "--no-sandbox", "--disable-dev-shm-usage" -PassThru -WindowStyle Hidden -RedirectStandardOutput "d:\smoke-out.txt" -RedirectStandardError "d:\smoke-err.txt"
          Write-Host "Launched PID: $($proc.Id)"
          # Wait for startup
          Start-Sleep -Seconds $env:SMOKE_TIMEOUT
          # Check if the process is still alive after the timeout
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if ($alive) {
            Write-Host "Process still alive after $env:SMOKE_TIMEOUT s"
            # Check health endpoint
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:4747/health" -TimeoutSec 5
              if ($health.ok) { Write-Host "Health OK: $health" }
            } catch {
              Write-Host "Health endpoint not ready: $_"
            }
            # Check stdout/stderr for any renderer crash evidence
            $stdout = Get-Content "d:\smoke-out.txt" -ErrorAction SilentlyContinue -Raw
            $stderr = Get-Content "d:\smoke-err.txt" -ErrorAction SilentlyContinue -Raw
            if ($stdout -and ($stdout -match "Renderer process crashed|blank|failed")) {
              Write-Host "::fail::Smoke test FAILED: Renderer crash detected in stdout"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              exit 1
            }
            Write-Host "::notice::Smoke test PASSED: Process alive after $env:SMOKE_TIMEOUT s (frontend rendered)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 0
          } else {
            $stdout = Get-Content "d:\smoke-out.txt" -ErrorAction SilentlyContinue -Raw
            $stderr = Get-Content "d:\smoke-err.txt" -ErrorAction SilentlyContinue -Raw
            Write-Host "::fail::Smoke test FAILED: Electron process exited within $env:SMOKE_TIMEOUT s"
            if ($stdout) { Write-Host "stdout: $stdout" }
            if ($stderr) { Write-Host "stderr: $stderr" }
            exit 1
          }
      - name: Manifest with release notes (unsigned)
        if: steps.v.outputs.notes != ''
        env:
          V: ${{ steps.v.outputs.version }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: node scripts/release-manifest.mjs --zip "$env:PKG\legion-$env:V-app.zip" --out "$env:PKG" --notes "$env:NOTES"
      - name: Check SHA256SUMS and list every hash in the run summary
        env:
          V: ${{ steps.v.outputs.version }}
          ARTIFACT: ${{ steps.v.outputs.artifact }}
          COMMIT: ${{ steps.v.outputs.commit }}
        run: |
          $files = "legion-$env:V-app.zip", "legion-$env:V-win-x64.zip", 'legion-update-manifest.json', 'SHA256SUMS.txt', 'install.ps1', 'install.sh'
          foreach ($f in $files) { if (-not (Test-Path -LiteralPath (Join-Path $env:PKG $f) -PathType Leaf)) { throw "$f was not built" } }
          $lines = Get-Content -LiteralPath (Join-Path $env:PKG 'SHA256SUMS.txt') | Where-Object { $_ }
          foreach ($l in $lines) {
            $h, $n = $l -split '  ', 2
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:PKG $n)).Hash.ToLowerInvariant()
            if ($got -ne $h) { throw "SHA256SUMS.txt says $h for $n, the file is $got" }
          }
          foreach ($n in $files[0..2]) { if (-not ($lines | Where-Object { $_.EndsWith("  $n") })) { throw "SHA256SUMS.txt has no line for $n" } }
          $kind = if ($env:ARTIFACT.EndsWith('-release')) { 'release build (unsigned)' } else { 'DRY RUN, not for release' }
          $sum = @("### Legion $env:V $kind", '', "Artifact ``$env:ARTIFACT``, commit ``$env:COMMIT``", '', '| file | SHA-256 |', '| --- | --- |')
          foreach ($f in $files) { $sum += "| $f | ``$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:PKG $f)).Hash.ToLowerInvariant())`` |" }
          $sum += '', 'Next, on the PC: download the artifact, check these hashes, sign, pre-flight, verify, publish (docs/SHIPPING.md).'
          $sum | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.v.outputs.artifact }}
          path: |
            ${{ runner.temp }}/legion-pkg/legion-${{ steps.v.outputs.version }}-app.zip
            ${{ runner.temp }}/legion-pkg/legion-${{ steps.v.outputs.version }}-win-x64.zip
            ${{ runner.temp }}/legion-pkg/legion-update-manifest.json
            ${{ runner.temp }}/legion-pkg/SHA256SUMS.txt
            ${{ runner.temp }}/legion-pkg/install.ps1
            ${{ runner.temp }}/legion-pkg/install.sh
          if-no-files-found: error
          retention-days: 14
          # The zips are already compressed.
          compression-level: 0

  # Build attestation. This runs as its own job because artifact attestations need write scopes the build job must not hold:
  # id-token, attestations and artifact-metadata are exactly the three actions/attest documents for a provenance attestation.
  # The build job above stays read-only. This job only reads the uploaded artifact and records signed SLSA build provenance
  # (in-toto, Sigstore-signed) over its files on the repository's attestations API; it needs no secret, never publishes a
  # release, and the release signing key is not here. Verify later with `gh attestation verify` (docs/SHIPPING.md).
  attest:
    name: attest the build
    needs: build
    if: github.repository == 'dnh33/legion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/legion-attest
      - name: Generate SLSA build provenance for the release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # One glob covers every file in the artifact: both zips, the manifest, SHA256SUMS.txt and the two installers.
          subject-path: ${{ runner.temp }}/legion-attest/*
