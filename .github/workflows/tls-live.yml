name: TLS key block (live)

# The live proof that the core refuses TLS chains through the compromised eMudhra CA keys (test/tls-blocklist-live.test.ts). It talks to the
# incident tracker's test hosts (*.we-have-a-problem.com), which are outside this project and will go away one day, so it is NOT part of the
# per-PR CI: it runs on pull requests that touch the block, the test or the Electron pin, by hand, and once a week. When the weekly run fails
# because the hosts are gone (an unreachable host fails here on purpose), remove this workflow; do not leave a red check to be ignored.
on:
  pull_request:
    paths:
      - src/core/tls-blocklist*.ts
      - src/bin/legion-core.ts
      - test/tls-blocklist*.ts
      - test/fixtures/tls-probe/**
      - package.json
      - package-lock.json
      - .github/workflows/tls-live.yml
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

# Read-only token, pull_request (never pull_request_target), no secrets, actions pinned to commit SHAs.
permissions:
  contents: read

concurrency:
  group: tls-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Live proof that chains through the compromised eMudhra CA keys are refused by the core's key block (Electron's Node and plain
  # Node), Electron itself (its Node and the window's Chromium) and the Claude Code the Agent SDK bundles:
  # test/tls-blocklist-live.test.ts against the incident tracker's test hosts. An unreachable host fails here (LEGION_LIVE_TLS_REQUIRE).
  # The controls take the block away (on Node 22.23.3, before Node's own fix), and run the old Electron and Claude Code, and must then
  # see the chain TRUSTED.
  tls-live:
    name: TLS key block (live) ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # scripts/postinstall.mjs skips the Electron download when CI or ELECTRON_SKIP_BINARY_DOWNLOAD is set; this job needs the real binary.
      CI: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      LEGION_LIVE_TLS: "1"
      LEGION_LIVE_TLS_REQUIRE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the binary itself, whatever the postinstall decided (GitHub may not always let a job clear CI)
      - run: node node_modules/electron/install.js
      - run: npm run build:ts
      - name: a display for the Electron window (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y xvfb; }
      # LIVE runs the test, with a display on Linux (the Chromium case needs one).
      - name: the core's block, Electron's Node and Chromium, and the bundled Claude Code refuse the chains
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node --test dist/test/tls-blocklist-live.test.js; else node --test dist/test/tls-blocklist-live.test.js; fi
      # Node 22.23.4 and 24.22.1 (2026-10-21) refuse these chains themselves (nodejs/node#66871), so the "node 22" above may no longer
      # trust them. The block still guards users on older Node, so the control runs on the last 22.x without that fix.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: control, without the core's block plain Node (22.23.3) must TRUST the chain
        run: |
          cp dist/src/core/tls-blocklist-install.js "$RUNNER_TEMP/block.js"
          echo "export {};" > dist/src/core/tls-blocklist-install.js
          set +e
          node --test --test-name-pattern "plain Node" dist/test/tls-blocklist-live.test.js > "$RUNNER_TEMP/control.txt" 2>&1
          rc=$?
          set -e
          cp "$RUNNER_TEMP/block.js" dist/src/core/tls-blocklist-install.js
          cat "$RUNNER_TEMP/control.txt"
          if [ "$rc" -eq 0 ]; then echo "::error::the live test passed without the block: it cannot tell a protected core from an unprotected one"; exit 1; fi
          grep -q "plain Node.js with the block [a-z]* TRUSTS a chain through a compromised eMudhra CA" "$RUNNER_TEMP/control.txt" \
            || { echo "::error::without the block, plain Node did not fail with TRUSTS: the control failed for another reason"; exit 1; }
          echo "control ok: without the block plain Node trusts the compromised chain"
      # It must fail for the right reason: the old Electron and the old Claude Code TRUST the chain. A missing binary or an unreachable
      # host proves nothing. Linux only: there the OS cannot refuse first.
      - name: control, Electron 44.5.1 and Claude Code 2.1.296 must TRUST the chain
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/old" electron@44.5.1 @anthropic-ai/claude-agent-sdk-linux-x64@0.3.296
          node "$RUNNER_TEMP/old/node_modules/electron/install.js"
          oldE="$RUNNER_TEMP/old/node_modules/electron/dist/electron"; oldC="$RUNNER_TEMP/old/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude"
          test -x "$oldE" || { echo "::error::no Electron 44.5.1 binary at $oldE"; exit 1; }
          test -x "$oldC" || chmod +x "$oldC"; "$oldC" --version
          set +e
          LEGION_LIVE_TLS_ELECTRON="$oldE" LEGION_LIVE_TLS_CLAUDE="$oldC" xvfb-run -a node --test dist/test/tls-blocklist-live.test.js > "$RUNNER_TEMP/old.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/old.txt"
          if [ "$rc" -eq 0 ]; then echo "::error::the old Electron and Claude Code passed the live test: it cannot tell patched from unpatched"; exit 1; fi
          for who in "Electron's own Node [a-z]*" "Electron's Chromium [a-zA-Z]*" "Claude Code"; do
            grep -qE "$who TRUSTS a chain through a compromised eMudhra CA" "$RUNNER_TEMP/old.txt" \
              || { echo "::error::the old build of \"$who\" did not fail with TRUSTS: the control failed for another reason"; exit 1; }
          done
          echo "control ok: Electron 44.5.1 (Node and Chromium) and Claude Code 2.1.296 trust the compromised chain"
