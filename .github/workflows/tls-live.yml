name: TLS key block (live)

# The live proof that the core refuses TLS chains through the compromised eMudhra CA keys (test/tls-blocklist-live.test.ts). It talks to the
# incident tracker's test hosts (*.we-have-a-problem.com), which are outside this project and will go away one day, so it is NOT part of the
# per-PR CI: it runs on pull requests that touch the block, the test or the Electron pin, by hand, and once a week. When the weekly run fails
# because the hosts are gone (an unreachable host fails here on purpose), remove this workflow; do not leave a red check to be ignored.
on:
  pull_request:
    paths:
      - src/core/tls-blocklist*.ts
      - src/bin/legion-core.ts
      - test/tls-blocklist*.ts
      - test/fixtures/tls-probe/**
      - package.json
      - package-lock.json
      - .github/workflows/tls-live.yml
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

# Read-only token, pull_request (never pull_request_target), no secrets, actions pinned to commit SHAs.
permissions:
  contents: read

concurrency:
  group: tls-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Live proof that the core's key block refuses chains through the compromised eMudhra CA keys on Electron's Node (a Windows package
  # install) and on plain Node (Mac, Linux, source installs): test/tls-blocklist-live.test.ts against the incident tracker's test hosts.
  # An unreachable host fails here (LEGION_LIVE_TLS_REQUIRE). The control removes the block and must then see the chain TRUSTED.
  tls-live:
    name: TLS key block (live) ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # scripts/postinstall.mjs skips the Electron download when CI or ELECTRON_SKIP_BINARY_DOWNLOAD is set; this job needs the real binary.
      CI: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      LEGION_LIVE_TLS: "1"
      LEGION_LIVE_TLS_REQUIRE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the binary itself, whatever the postinstall decided (GitHub may not always let a job clear CI)
      - run: node node_modules/electron/install.js
      - run: npm run build:ts
      - name: the core's block refuses the chains on Electron's Node and on plain Node
        run: node --test dist/test/tls-blocklist-live.test.js
      - name: control, without the block the same test must fail because the chain is TRUSTED
        run: |
          echo "export {};" > dist/src/core/tls-blocklist-install.js
          set +e
          node --test dist/test/tls-blocklist-live.test.js > "$RUNNER_TEMP/control.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/control.txt"
          if [ "$rc" -eq 0 ]; then echo "::error::the live test passed without the block: it cannot tell a protected core from an unprotected one"; exit 1; fi
          for rt in "Electron's Node" "plain Node.js"; do
            grep -q "$rt with the block [a-z]* TRUSTS a chain through a compromised eMudhra CA" "$RUNNER_TEMP/control.txt" \
              || { echo "::error::without the block, \"$rt\" did not fail with TRUSTS: the control failed for another reason"; exit 1; }
          done
          echo "control ok: without the block both runtimes trust the compromised chain"
