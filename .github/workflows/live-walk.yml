name: Live walk

# The real update path, end to end, with nothing faked: a fresh Windows runner installs an OLD published Legion with that release's own install.ps1,
# starts it with its own LEGION_HOME, and lets the app's OWN updater find, download, verify and apply the REAL GitHub releases
# (0.2.7 -> the 0.3.0 stepping stone -> the newest release). After every hop it asserts: health answers, the version is the expected hop, user
# data survived, the install folder holds every file of the hop's real package, nothing rolled back, and the updater state is clean.
# Unlike full-install-rehearsal.yml there is no loopback server, no throwaway key, no preload and no LEGION_INSTALL_BASE; the walk refuses to start
# if any of those test switches (or LEGION_REHEARSAL) is in its environment. It only READS public releases: no secrets, a read-only token, nothing published.
#   walk    from `from` (default 0.2.7) through the stone to `to`
#   direct  from the stone (0.3.0) straight to `to`
# With `tag` (a release that is not Latest yet) the app's GitHub traffic is relayed to that tag's real assets; see scripts/live-walk/relay.mjs.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Version to install first (a published release, e.g. 0.2.7).
        required: false
        default: "0.2.7"
      to:
        description: Version to end on (empty = the latest release).
        required: false
        default: ""
      tag:
        description: Walk to this tag's real assets BEFORE it is Latest (e.g. v0.3.2, a prerelease). Overrides `to`. A draft is not public and cannot be fetched.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-walk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  walk:
    name: ${{ matrix.name }}
    if: github.repository == 'dnh33/legion'
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: walk (from input through the stone)
            slot: walk
          - name: direct (from the stone)
            slot: direct
    defaults:
      run:
        shell: pwsh
    env:
      FROM_INPUT: ${{ inputs.from }}
      TO_INPUT: ${{ inputs.to }}
      TAG_INPUT: ${{ inputs.tag }}
      SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
      - name: Work out the versions (inputs checked before use)
        run: |
          $from = if ($env:SLOT -eq 'direct') { '0.3.0' } elseif ([string]::IsNullOrWhiteSpace($env:FROM_INPUT)) { '0.2.7' } else { $env:FROM_INPUT }
          if ($from -notmatch '^\d{1,9}\.\d{1,9}\.\d{1,9}$') { throw "from must be a plain version like 0.2.7, got: $from" }
          $to = $env:TO_INPUT
          if ([string]::IsNullOrWhiteSpace($to)) { $to = 'latest' }
          elseif ($to -ne 'latest' -and $to -notmatch '^\d{1,9}\.\d{1,9}\.\d{1,9}$') { throw "to must be a plain version or empty, got: $to" }
          $tag = $env:TAG_INPUT
          if (-not [string]::IsNullOrWhiteSpace($tag) -and $tag -notmatch '^v\d{1,9}\.\d{1,9}\.\d{1,9}$') { throw "tag must look like v0.3.2, got: $tag" }
          "LW_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LW_FROM=$from" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LW_TO=$to" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "from $from to $to"
      - name: Install the old release with ITS OWN install.ps1, as a user does (no launch)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ps1 = Join-Path $dir 'install.ps1'
          curl.exe -fsSL --retry 3 -o $ps1 "https://github.com/dnh33/legion/releases/download/v$($env:LW_FROM)/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "could not download install.ps1 of v$($env:LW_FROM)" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $ps1 -NoLaunch -Version $env:LW_FROM -InstallDir "$env:RUNNER_TEMP\legion-install"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
      - name: Walk the real releases
        run: |
          $extra = @()
          if (-not [string]::IsNullOrWhiteSpace($env:LW_TAG)) { $extra = @('--tag', $env:LW_TAG) }
          node scripts/live-walk/run-live-walk.mjs --install "$env:RUNNER_TEMP\legion-install" --work "$env:RUNNER_TEMP\work" --from $env:LW_FROM --to $env:LW_TO @extra
      - name: Keep the logs and updater state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-walk-logs-${{ matrix.slot }}
          path: ${{ runner.temp }}/work/artifacts
          if-no-files-found: ignore
          retention-days: 14
