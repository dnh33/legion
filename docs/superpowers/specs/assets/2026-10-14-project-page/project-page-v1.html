<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project page 0.3.0</title>
<link rel="stylesheet" href="/files/fonts.css">
<link rel="stylesheet" href="/files/tokens.css">
<style>
/* Proposed token additions from the audit. Batch 2: --control-line measured (3:1 or better on bg, surface and surface-2). */
:root { --danger-ink:#1b1300; --warn-ink:#1b1300; --control-line:#667182; --warn-line:rgba(255,204,102,.38); --live:#7CFFB2; }
:root[data-theme='light'] { --danger-ink:#fff; --warn-ink:#fff; --control-line:#737d8f; --warn-line:rgba(143,93,12,.35); --live:#0c9f5e; }

* { box-sizing:border-box; }
html, body { margin:0; background:#05070a; color:var(--text); font:14px/1.45 var(--font); }
:root[data-theme='light'] body { background:#c9ced6; }
::selection { background:var(--accent-soft); color:var(--text); }
button { font:inherit; color:inherit; }
/* neutral focus ring: mint is for New task and live work only */
:focus-visible { outline:2px solid var(--text); outline-offset:2px; border-radius:var(--r-sm); }
.num { font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[hidden] { display:none !important; }

/* mockup controls (not part of the design) */
.mk { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:10px 16px; background:#000; color:#9aa3b2; font:12px var(--font); border-bottom:1px solid #222; }
.mk b { color:#e6e9ef; font-weight:600; }
.mk .seg { display:flex; gap:2px; background:#14171c; border-radius:7px; padding:2px; }
.mk .seg button { border:0; background:none; color:#9aa3b2; padding:4px 9px; border-radius:5px; cursor:pointer; }
.mk .seg button[aria-pressed=true] { background:#2a313b; color:#fff; }
.mk .note { margin-left:auto; max-width:520px; }
.stage { padding:24px; overflow-x:auto; }

/* app frame */
.app { position:relative; margin:0 auto; background:var(--bg); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; display:grid; grid-template-rows:40px 1fr; height:var(--h,820px); width:var(--w,1280px); }
.tb { display:flex; align-items:center; gap:10px; padding:0 12px; border-bottom:1px solid var(--line); background:var(--bg); }
.tb .word { font:700 21px/1 var(--font-display); letter-spacing:.01em; }
.tb .ver { color:var(--muted); font-size:11px; }
.tb .search { margin-left:18px; flex:0 1 300px; height:28px; border:1px solid var(--control-line); background:none; border-radius:var(--r); display:flex; align-items:center; padding:0 9px; gap:7px; color:var(--muted); font-size:12.5px; cursor:pointer; text-align:left; }
.tb .search:hover { color:var(--text); }
.tb .sp { flex:1; }
.tb .ico { width:28px; height:28px; display:grid; place-items:center; color:var(--muted); border-radius:var(--r-sm); background:none; border:0; cursor:pointer; }
.tb .ico:hover { color:var(--text); background:var(--surface-2); }
.tb .ico[aria-pressed=true] { color:var(--text); background:var(--surface-2); }
.body { display:grid; grid-template-columns:240px minmax(0,1fr) auto; min-height:0; }
.w960 .body { grid-template-columns:208px minmax(0,1fr) auto; }

/* hover and press: 120 ms, paint only */
.btn, .rail .row, .item, .tbl tr, .card, .pill, .agt, .gsel, .field, .snav a, .more, .chip2, .segc button, .vsw button, .tabs button, .back, .tb .ico, .lnk, .chipbtn { transition:background-color 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); }
.btn:active, .pill:active, .agt:active, .card:active, .gsel:active, .segc button:active, .chipbtn:active { transform:translateY(1px); }
@media (prefers-reduced-motion:reduce) { .btn:active, .pill:active, .agt:active, .card:active, .gsel:active, .segc button:active, .chipbtn:active { transform:none; } }

/* rail */
.rail { border-right:1px solid var(--line); padding:12px 8px 8px; display:flex; flex-direction:column; gap:2px; min-height:0; overflow:hidden; }
.rail .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 8px 4px; display:flex; justify-content:space-between; }
.rail .lbl .n { color:var(--text-2); }
.rail .projwrap { margin:0 4px 8px; position:relative; }
.rail .proj { width:100%; height:32px; border:1px solid var(--control-line); border-radius:var(--r); display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--surface); cursor:pointer; text-align:left; }
.rail .proj:hover { background:var(--surface-2); }
.rail .proj .pn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail .proj .else { flex:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--warn); }
.rail .proj .else i { width:7px; height:7px; border-radius:50%; background:var(--warn); }
.rail .proj svg { flex:none; color:var(--muted); }
.rail .scrl { overflow:auto; min-height:0; flex:1; display:flex; flex-direction:column; gap:2px; margin:0 -4px; padding:0 4px; }
.rail .row { display:flex; gap:10px; align-items:center; padding:5px 8px; border-radius:var(--r); width:100%; text-align:left; background:none; border:0; cursor:pointer; min-height:44px; }
.rail .row:hover { background:var(--surface); }
.rail .row.sel { background:var(--surface-2); }
.rail .row .who { min-width:0; flex:1; }
.rail .row .who b { display:block; font-weight:600; font-size:13.5px; }
.rail .row .who span { display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail .row.attn .who span { color:var(--warn); }
.rail .row.work .who span { color:var(--text-2); }
.rail .elsewhere .row { min-height:40px; }
.rail .elsewhere .row .who span { color:var(--warn); }
.rail .rest { padding:6px 8px; color:var(--muted); font-size:12px; }
.av { flex:none; width:34px; height:34px; border-radius:9px; background:var(--surface-3); display:grid; place-items:center; font-weight:600; color:var(--text-2); position:relative; }
.av.s { width:20px; height:20px; border-radius:6px; font-size:10.5px; }
/* a live dot is never the only signal: the chip, strip and rows say "working" in words */
.av .dot { position:absolute; right:-2px; bottom:-2px; width:9px; height:9px; border-radius:50%; background:var(--live); box-shadow:0 0 0 2px var(--bg); }

/* page */
.page { min-width:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto 1fr; min-height:0; }
.ph { display:flex; align-items:center; gap:14px; padding:16px 24px 12px; }
.back { flex:none; width:32px; height:32px; display:grid; place-items:center; border-radius:var(--r); color:var(--muted); border:1px solid transparent; }
.back:hover { border-color:var(--line-strong); color:var(--text); }
.ph .t { min-width:0; flex:1; }
.ph h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph .meta { color:var(--muted); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sep { color:var(--faint); }
.ph .meta .sep { margin:0 6px; }
.acts { flex:none; display:flex; gap:8px; align-items:center; position:relative; }
.acts .why { color:var(--muted); font-size:12.5px; }
.btn { height:32px; border-radius:var(--r); border:1px solid var(--control-line); background:var(--surface); padding:0 12px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap; font-weight:500; color:var(--text); }
.btn:hover { background:var(--surface-2); }
.btn.sm { height:28px; padding:0 10px; }
.btn.ghost { border-color:transparent; background:none; color:var(--text-2); }
.btn.ghost:hover { background:var(--surface-2); color:var(--text); }
.btn.icon { width:32px; padding:0; justify-content:center; }
.btn.icon.sm { width:28px; }
.split { display:inline-flex; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
/* Light: white on #0c9f5e is 3.42:1, so the button takes the darker accent that already exists (5.41:1) */
:root[data-theme='light'] .btn.primary { background:var(--accent-text); border-color:var(--accent-text); }
:root[data-theme='light'] .btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn[disabled] { cursor:not-allowed; background:none; color:var(--text-2); border-style:dashed; font-weight:500; }
.btn.primary[disabled], :root[data-theme='light'] .btn.primary[disabled] { background:none; border-color:var(--control-line); color:var(--text-2); }
.btn:disabled:hover { background:none; }
.btn.strong { font-weight:600; border-color:var(--text-2); color:var(--text); }
.btn.strong:hover { background:var(--surface-3); }
/* a switch-sized "Pause" control and the neutral toggle in the header menu */
.lnk { background:none; border:0; padding:0 2px; margin:0; min-height:24px; display:inline-flex; align-items:center; color:var(--text-2); cursor:pointer; text-decoration:underline; text-decoration-color:var(--control-line); text-underline-offset:3px; font:inherit; font-size:inherit; }
.lnk:hover { color:var(--text); text-decoration-color:var(--text-2); }

.tabbar { display:flex; align-items:flex-end; border-bottom:1px solid var(--line); padding:0 24px; gap:16px; }
.tabs { display:flex; gap:22px; flex:1; min-width:0; }
.tabs button { background:none; border:0; padding:6px 0 10px; min-height:36px; color:var(--muted); cursor:pointer; position:relative; font-weight:500; font-family:inherit; }
.tabs button:hover { color:var(--text); }
.tabs button .c { color:var(--muted); margin-left:5px; font-weight:400; }
.tabs button[aria-selected=true] { color:var(--text); }
/* neutral underline: mint is for New task and live work */
.tabs button[aria-selected=true]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--text); border-radius:2px; }
.tabs button .pip { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warn); margin-left:6px; vertical-align:2px; }
.vsw { align-self:center; margin-bottom:5px; display:inline-flex; border:1px solid var(--control-line); border-radius:var(--r); overflow:hidden; flex:none; }
.vsw button { height:28px; padding:0 10px; font-size:12.5px; color:var(--muted); background:var(--surface); border:0; cursor:pointer; }
.vsw button + button { border-left:1px solid var(--control-line); }
.vsw button:hover { color:var(--text); }
.vsw button[aria-checked=true] { color:var(--text); background:var(--surface-3); font-weight:500; }

.area { position:relative; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); overflow:hidden; }
.area > .scroll { min-height:0; }
.scroll { overflow:auto; min-height:0; padding:18px 24px 40px; container-type:inline-size; container-name:pg; }
.scroll::-webkit-scrollbar { width:10px; } .scroll::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:8px; border:3px solid var(--bg); }
.scroll.fade { animation:cfade 120ms ease-out; }
@keyframes cfade { from { opacity:0; } }
.inner { max-width:1180px; }

/* banners */
.banner { display:flex; gap:12px; align-items:flex-start; padding:10px 14px; border-radius:var(--r-lg); border:1px solid var(--warn-line); background:var(--warn-soft); margin-bottom:18px; position:relative; }
.banner.neutral { border-color:var(--line-strong); background:var(--surface); }
.banner .bi { color:var(--warn); flex:none; margin-top:3px; }
.banner.neutral .bi { color:var(--muted); }
.banner .bt { flex:1; min-width:0; align-self:center; }
.banner .bt b { font-weight:600; }
.banner .bt span { color:var(--text-2); }
.banner .ba { display:flex; gap:8px; flex:none; align-self:center; }
.banner.line { align-items:center; }

/* overview */
.ov { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:28px; align-items:start; }
@container pg (max-width:880px) { .ov { grid-template-columns:minmax(0,1fr); } }
.grp + .grp { margin-top:22px; }
.grp h2 { display:flex; align-items:baseline; gap:8px; margin:0 0 6px; font-size:13px; font-weight:600; color:var(--text-2); }
.grp h2 .n { color:var(--muted); font-weight:400; }
.grp.live h2::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--live); align-self:center; animation:breathe 2.4s var(--ease) infinite; }
@keyframes breathe { 50% { opacity:.35; } }
@media (prefers-reduced-motion:reduce) { .grp.live h2::before, .ws h2::before { animation:none; } }
.list { border-top:1px solid var(--line); }
.item { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); }
.item:hover { background:var(--surface); }
.item .ti { min-width:0; }
.item .ti a { color:var(--text); text-decoration:none; font-weight:500; display:block; min-height:24px; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .ti a:hover { text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control-line); }
.item .sub { color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .sub code { font:12px var(--font-mono); color:var(--text-2); background:var(--code-bg); padding:1px 5px; border-radius:4px; }
.item .r { display:flex; gap:12px; align-items:center; color:var(--muted); font-size:12.5px; white-space:nowrap; }
.item .r .cost { width:52px; text-align:right; }
.item .r .ago { width:44px; text-align:right; }
.st { width:16px; height:16px; color:var(--muted); flex:none; }
.st.warn { color:var(--warn); } .st.live { color:var(--live); } .st.bad { color:var(--danger); }
.more { color:var(--muted); background:none; border:0; padding:0 4px; min-height:32px; cursor:pointer; font-size:12.5px; }
.more:hover { color:var(--text); }

/* working now strip */
.ws { margin-bottom:14px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; }
.ws h2 { display:flex; align-items:baseline; gap:8px; margin:0; font-size:13px; font-weight:600; color:var(--text-2); }
.ws h2::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--live); align-self:center; animation:breathe 2.4s var(--ease) infinite; }
.ws h2 .n { color:var(--muted); font-weight:400; }
.ws .chips2 { display:flex; flex-wrap:wrap; gap:8px; position:relative; }
.ws .qn { color:var(--muted); font-size:12.5px; display:inline-flex; gap:6px; align-items:center; }
.chipbtn { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 4px; border:1px solid var(--control-line); border-radius:999px; background:var(--surface); color:var(--text); cursor:pointer; font-size:13px; font-weight:500; }
.chipbtn:hover, .chipbtn[aria-expanded=true] { background:var(--surface-2); }
.chipbtn .mult { color:var(--text-2); font-weight:600; font-variant-numeric:tabular-nums; }

.ws .none { color:var(--muted); font-size:12.5px; }

/* side column */
.side { display:flex; flex-direction:column; gap:18px; }
.blk h3 { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--text-2); display:flex; justify-content:space-between; align-items:center; }
.blk h3 a, .blk h3 .lnk { color:var(--muted); font-weight:400; text-decoration:none; }
.blk h3 a:hover, .blk h3 .lnk:hover { color:var(--text); }
.spend .big { font-size:20px; font-weight:600; letter-spacing:-.01em; }
.spend .of { color:var(--muted); }
.bar { height:6px; background:var(--surface-3); border-radius:4px; margin:8px 0 6px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--text-2); border-radius:4px; }
.bar.hi i { background:var(--warn); }
.spend .foot { color:var(--muted); font-size:12.5px; }
.rooms .rm { display:grid; grid-template-columns:62px minmax(0,1fr); gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.stackb { display:flex; align-items:center; }
.stackb .bslot + .bslot, .stackb .bw + .bw { margin-left:-8px; }
.stackb .bslot { box-shadow:0 0 0 2px var(--bg); }
.rooms .rm .nm { min-width:0; }
.rooms .rm .nm .rt { min-height:24px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:500; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:var(--text); }
.rooms .rm .nm .rt:hover { text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control-line); }
.rooms .rm .nm span.s { color:var(--muted); font-size:12.5px; display:block; }
.team { display:flex; flex-wrap:wrap; gap:6px; }
.mini { position:relative; display:inline-flex; }
.mini .dot { position:absolute; right:-2px; bottom:-2px; width:8px; height:8px; border-radius:50%; background:var(--live); box-shadow:0 0 0 2px var(--bg); }
.skip { position:absolute; left:8px; top:-60px; z-index:100; background:var(--surface-3); color:var(--text); border:1px solid var(--control-line); border-radius:var(--r); padding:6px 12px; text-decoration:none; }
.skip:focus { top:6px; }
.ferr { color:var(--danger); font-size:12.5px; margin-top:4px; }
.inp[aria-invalid=true] { border-color:var(--danger); }
.team .av { width:28px; height:28px; font-size:12px; }

/* tasks tab */
.tbl { width:100%; border-collapse:collapse; }
.tbl th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
.tbl td { padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
.tbl td.title { white-space:normal; width:100%; min-width:200px; }
.tbl td.title a { color:var(--text); text-decoration:none; min-height:24px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tbl td.title a:hover { text-decoration:underline; text-underline-offset:3px; }
.tbl td.r, .tbl th.r { text-align:right; color:var(--muted); }
.tbl .qline { display:block; color:var(--muted); font-size:12px; white-space:normal; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); white-space:nowrap; vertical-align:middle; line-height:1; }
.chip i { width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
.chip.paused i, .chip.waiting i { background:var(--warn); } .chip.failed i { background:var(--danger); } .chip.done i { background:var(--muted); } .chip.working i { background:var(--live); }
.chip.queued i { background:none; border:1.5px solid var(--muted); width:8px; height:8px; }

/* empty / archived */
.empty { max-width:520px; margin:12px 0 0; text-align:left; }
.empty h2 { font-size:17px; margin:0 0 6px; }
.empty p { color:var(--text-2); margin:0 0 16px; }
.steps { display:grid; gap:10px; margin:0 0 18px; max-width:460px; }
.steps div { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--r-lg); background:var(--surface); }
.steps div .k { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--surface-3); font-size:12px; color:var(--text-2); flex:none; }
.steps div.done .k { background:var(--text-2); color:var(--bg); }
.steps div .tx { flex:1; }
.steps div .tag2 { font-size:12px; color:var(--text-2); }
.empty-c { max-width:480px; margin:8px 0 0; text-align:left; }
.empty-c h2 { font-size:17px; margin:0 0 6px; } .empty-c p { color:var(--text-2); margin:0 0 14px; }

/* toolbar row above tab content */
.tools { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.tools .grow { flex:1; }
.field { height:32px; border:1px solid var(--control-line); background:var(--surface); border-radius:var(--r); display:inline-flex; align-items:center; gap:6px; padding:0 10px; color:var(--text-2); font-size:13px; white-space:nowrap; cursor:pointer; }
.field:hover { background:var(--surface-2); color:var(--text); }
.field.search { flex:0 1 200px; min-width:110px; overflow:hidden; color:var(--muted); }
.field svg { color:var(--muted); flex:none; }
.qhelp { flex:none; width:32px; height:32px; border-radius:var(--r); border:1px solid var(--control-line); display:grid; place-items:center; color:var(--muted); font-size:13px; background:none; cursor:pointer; }
.qhelp:hover { color:var(--text); background:var(--surface-2); }
.pophelp { position:absolute; z-index:30; width:300px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--r-lg); padding:12px 14px; box-shadow:0 14px 34px rgba(0,0,0,.35); font-size:13px; color:var(--text-2); }
:root[data-theme='light'] .pophelp { box-shadow:0 14px 34px rgba(20,24,32,.14); }
.pophelp b { color:var(--text); display:block; margin-bottom:4px; }

/* board */
.boardwrap { overflow-x:auto; margin:0 -24px; padding:0 24px 8px; }
.board { display:grid; grid-template-columns:repeat(5, minmax(118px,1fr)); gap:10px; align-items:start; }
@container pg (max-width:600px) { .board { grid-template-columns:repeat(5, minmax(150px,1fr)); } }
.col { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:10px; min-height:120px; }
.col h4 { margin:0 0 8px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; }
.col h4 .n { font-variant-numeric:tabular-nums; }
.col h4 .n.bad { color:var(--danger); }

/* rooms tab */

.rrow .ra { display:flex; gap:6px; align-items:center; }
.fnote { color:var(--muted); font-size:12.5px; margin-top:10px; }

/* settings */
.cnt { color:var(--muted); font-size:12px; margin-top:4px; text-align:right; }
.row2 { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.inp { width:100%; height:32px; border:1px solid var(--control-line); background:var(--surface); color:var(--text); border-radius:var(--r); padding:0 10px; font:inherit; }
textarea.inp { height:auto; min-height:120px; padding:9px 10px; line-height:1.5; resize:vertical; }
.path { font:12.5px/1.5 var(--font-mono); color:var(--text-2); background:var(--code-bg); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip2 { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 4px; border:1px solid var(--line-strong); border-radius:999px; background:var(--surface); font-size:13px; }

.chip2 .x:hover { background:var(--surface-3); color:var(--text); }
.chip2.addc { padding:0 12px; border-style:dashed; border-color:var(--control-line); color:var(--text-2); cursor:pointer; }
.opt { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:start; padding:12px 0; }
.opt + .opt { border-top:1px solid var(--line); }
.opt b { display:block; font-weight:500; }
.opt span.h { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; max-width:56ch; }
/* neutral switch, 40 x 24 */
.sw { width:40px; height:24px; border-radius:999px; border:1px solid var(--control-line); background:var(--surface-3); position:relative; cursor:pointer; padding:0; flex:none; }
.sw::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform var(--t) var(--ease), background-color var(--t); }
.sw[aria-checked=true] { background:var(--text-2); border-color:var(--text-2); }
.sw[aria-checked=true]::after { transform:translateX(16px); background:var(--bg); }
.sw[disabled] { opacity:.5; cursor:not-allowed; }
.num-in { display:inline-flex; align-items:center; gap:6px; }

.segc { display:inline-flex; border:1px solid var(--control-line); border-radius:var(--r); overflow:hidden; }
.segc button { border:0; background:var(--surface); padding:0 12px; min-height:32px; cursor:pointer; color:var(--text-2); font-size:13px; }

.segc button:hover { color:var(--text); }
.segc button[aria-pressed=true], .segc button[aria-checked=true] { background:var(--surface-3); color:var(--text); font-weight:500; }
.sub-opts { margin:8px 0 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.note-in { margin-top:8px; padding:9px 11px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface); color:var(--text-2); font-size:12.5px; }

/* agent-first overview */
.units { border-top:1px solid var(--line); }
.unit { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); align-items:start; }

.u-also { margin-top:2px; color:var(--muted); font-size:12.5px; }
.u-tail { margin-top:4px; color:var(--muted); font-size:12.5px; display:flex; flex-wrap:wrap; gap:0 6px; align-items:center; }
.u-r { display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
.u-r .cost { color:var(--text-2); }
.u-r .esc { color:var(--text-2); }
.runsbtn { display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 8px; border:1px solid var(--control-line); border-radius:999px; background:none; color:var(--text-2); font-size:12px; cursor:pointer; }
.runsbtn:hover { background:var(--surface-2); color:var(--text); }
.idle { border-top:1px solid var(--line); }
.irow { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 4px; border-bottom:1px solid var(--line); font-size:13px; }
.irow .nm b { font-weight:500; } .irow .nm span { color:var(--muted); margin-left:6px; }
.irow .c { color:var(--muted); font-size:12.5px; width:52px; text-align:right; }
.nontask { color:var(--muted); font-size:12.5px; padding:6px 4px; }
.legend { color:var(--muted); font-size:12.5px; margin-top:14px; max-width:70ch; }

/* settings v2 */
.set2 { display:grid; grid-template-columns:168px minmax(0,1fr); gap:32px; align-items:start; }
.snav { position:sticky; top:0; display:flex; flex-direction:column; gap:1px; }
.snav a { color:var(--muted); text-decoration:none; padding:0 10px; min-height:28px; border-radius:var(--r-sm); font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.snav a:hover { color:var(--text); background:var(--surface); }
.snav a.on { color:var(--text); background:var(--surface-2); font-weight:500; }
.snav a .dt { width:6px; height:6px; border-radius:50%; background:var(--text-2); flex:none; }
.snav .leg { font-size:12px; color:var(--muted); padding:8px 10px 0; display:flex; gap:7px; align-items:center; }
.snav .leg i { width:6px; height:6px; border-radius:50%; background:var(--text-2); }
.w960 .set2 { grid-template-columns:minmax(0,1fr); gap:12px; }
.w960 .snav { flex-direction:row; overflow-x:auto; gap:4px; background:var(--bg); z-index:2; padding-bottom:8px; border-bottom:1px solid var(--line); align-items:center; }

.w960 .snav .leg { white-space:nowrap; padding:0 8px; }
.sbody { max-width:720px; }
.sbody section { padding:0 0 24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
.sbody h2 { margin:0 0 4px; font-size:15px; font-weight:600; display:flex; gap:8px; align-items:center; }
.sbody h2 svg { color:var(--muted); }
.sbody .lead { margin:0 0 12px; color:var(--muted); font-size:13px; max-width:62ch; }
.changed { font-size:11px; color:var(--text-2); border:1px solid var(--line-strong); border-radius:999px; padding:0 7px; font-weight:400; }
.reset { font-size:12px; color:var(--muted); background:none; border:0; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px; min-height:24px; }
.saved { font-size:12px; color:var(--text-2); display:inline-flex; gap:4px; align-items:center; margin-left:8px; font-weight:400; }
.saved svg { color:var(--text-2); }
.flabel { display:flex; align-items:center; font-weight:500; font-size:13px; margin:12px 0 6px; }
.flist { border:1px solid var(--line-strong); border-radius:var(--r-lg); background:var(--surface); }
.frow { display:grid; grid-template-columns:20px minmax(0,1fr) auto 32px; gap:10px; align-items:center; padding:11px 12px; position:relative; }
.frow + .frow { border-top:1px solid var(--line); }
.frow > svg { color:var(--muted); }
.frow .fn b { font-weight:500; }
.frow .fn .root { font-size:11px; color:var(--text-2); border:1px solid var(--line-strong); border-radius:999px; padding:0 7px; margin-left:6px; }
.frow .fp { font:12px/1.45 var(--font-mono); color:var(--muted); margin-top:2px; }
.w960 .frow { grid-template-columns:20px minmax(0,1fr) 32px; } .w960 .frow .gsel { grid-column:2; justify-self:start; }
.gsel { height:32px; border:1px solid var(--control-line); background:var(--surface); border-radius:var(--r); display:inline-flex; align-items:center; gap:7px; padding:0 10px; cursor:pointer; color:var(--text); font-size:13px; white-space:nowrap; }
.gsel:hover { background:var(--surface-2); }
.gsel svg { color:var(--muted); } .gsel.g svg.lv { color:var(--warn); }
.gmenu { display:none; position:absolute; right:44px; top:46px; z-index:5; width:330px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--r-lg); padding:6px; box-shadow:0 12px 32px rgba(0,0,0,.35); }
.frow.open .gmenu { display:block; } .frow.up .gmenu { top:auto; bottom:46px; }
.gmenu button { display:grid; grid-template-columns:18px minmax(0,1fr) 16px; gap:8px; width:100%; text-align:left; background:none; border:0; padding:8px; border-radius:var(--r); cursor:pointer; color:var(--text); }
.gmenu button:hover { background:var(--surface-3); }
.gmenu button[disabled] { opacity:.55; cursor:not-allowed; }
.gmenu b { display:block; font-weight:500; font-size:13px; } .gmenu span { display:block; color:var(--muted); font-size:12px; line-height:1.4; margin-top:1px; }
.gmenu svg { color:var(--muted); margin-top:2px; flex:none; } .gmenu .ck { color:var(--text); }
.honest { margin-top:10px; font-size:12.5px; color:var(--text-2); display:flex; gap:8px; align-items:flex-start; }
.honest svg { color:var(--muted); flex:none; margin-top:1px; }
.levels { margin-top:12px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; font-size:12.5px; color:var(--text-2); }
.levels b { color:var(--text); font-weight:500; display:flex; gap:6px; align-items:center; white-space:nowrap; }
.levels b svg { color:var(--muted); }
details.lv summary { cursor:pointer; color:var(--muted); font-size:12.5px; margin-top:10px; min-height:24px; display:flex; align-items:center; }
details.lv summary:hover { color:var(--text); }

/* since-you-last-looked digest */
.dg { border:1px solid var(--line-strong); border-radius:var(--r-lg); background:var(--surface); margin-bottom:22px; }
.dg-h { display:flex; gap:10px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line); min-height:46px; flex-wrap:wrap; }
.dg-h b { font-weight:600; }
.dg-h .sum { color:var(--muted); font-size:12.5px; }
.dg-h .sum i { font-style:normal; color:var(--text); font-weight:500; }
.dg-h .gap { flex:1; }
.dg-quiet { display:flex; align-items:center; gap:10px; padding:11px 14px; color:var(--text-2); flex-wrap:wrap; }
.dg-quiet .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
.dg-quiet .gap { flex:1; }
.dg-quiet .sum { color:var(--muted); font-size:12.5px; }
.dg-ul { list-style:none; margin:0; padding:0; }
.dg-r { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; padding:12px 14px; align-items:start; }
.dg-r + .dg-r { border-top:1px solid var(--line); }
.dg-r .what { font-weight:500; }
.dg-r .what .who { font-weight:600; }
.dg-r .ctx { margin-top:3px; color:var(--muted); font-size:12.5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.dg-r .ctx code { font:12px var(--font-mono); background:var(--code-bg); color:var(--text-2); padding:1px 5px; border-radius:4px; }
.conseq { display:inline-flex; gap:5px; align-items:center; font-size:12px; line-height:20px; color:var(--warn); border:1px solid var(--warn-line); border-radius:999px; padding:0 8px; }
.conseq.quiet { color:var(--text-2); border-color:var(--line-strong); }
.trust { margin-top:6px; font-size:12.5px; color:var(--text-2); }
.dg-r .acts2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.dg-r .acts2 .sep { width:1px; height:20px; background:var(--line-strong); margin:0 4px; }
.dg-r .acts2 .btn { height:32px; }
/* untrusted: tinted row plus the chip. No side stripe. */
.dg-r.untrusted { background:var(--warn-soft); }
.dg-r.untrusted:first-child { border-radius:var(--r-lg) var(--r-lg) 0 0; }
.dg-r.untrusted .trust { color:var(--text-2); }
.dg-r.untrusted .btn:not(.strong) { border-color:var(--muted); }
/* an answered row keeps its height (set inline), so nothing moves under the pointer */
.dg-r.done { align-items:center; color:var(--text-2); animation:fold 160ms ease-out; }
.dg-r.done .what { font-weight:400; }
.dg-r.done .acts2 { flex-wrap:nowrap; }
.dg-r.done.sent .what, .dg-r.done.final .what { color:var(--text-2); }
.holdbar { height:3px; margin-top:8px; background:var(--surface-3); border-radius:2px; overflow:hidden; max-width:260px; }
.holdbar i { display:block; height:100%; width:100%; background:var(--text-2); transform-origin:left; animation:holdbar linear forwards; }
@keyframes holdbar { to { transform:scaleX(0); } }
@media (prefers-reduced-motion:reduce) { .holdbar { display:none; } }
@keyframes fold { from { opacity:.4; } }
.dg-more { padding:0 10px; border-top:1px solid var(--line); min-height:40px; display:flex; align-items:center; }
.dg-foot { padding:0 14px; border-top:1px solid var(--line); min-height:44px; display:flex; align-items:center; gap:6px 14px; flex-wrap:wrap; color:var(--text-2); font-size:12.5px; }
.dg-foot b { font-weight:600; color:var(--text); }
.dg-foot .gap { flex:1; }
.dg-list { background:var(--surface-2); border-top:1px solid var(--line); border-radius:0 0 var(--r-lg) var(--r-lg); }
.dg-list .sec { padding:8px 14px 4px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.dg-list ul { list-style:none; margin:0; padding:0 0 4px; }
.dg-list li { display:flex; gap:10px; align-items:center; padding:2px 14px; min-height:32px; font-size:13px; }
.dg-list li .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dg-list li .m { color:var(--muted); font-size:12.5px; flex:none; }
.dg-sec { padding:7px 14px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--surface-2); margin:0; font-weight:400; }
.dg-sec2 { padding:7px 14px; font-size:12.5px; color:var(--text-2); margin:0; font-weight:600; border-bottom:1px solid var(--line); }
@container pg (max-width:640px) { .dg-r { grid-template-columns:28px minmax(0,1fr); } .dg-r .acts2 { grid-column:2; justify-content:flex-start; } .dg-r .acts2 .sep { display:none; } }

/* task sheet: pushes the list aside when there is room, covers it (dimmed, inert) when there is not */
.area.pushed { padding-right:480px; }
.area.over > .scroll { opacity:.38; pointer-events:none; }
.sheet { position:absolute; top:0; right:0; bottom:0; width:480px; max-width:92%; background:var(--surface); border-left:1px solid var(--line-strong); box-shadow:-18px 0 40px rgba(0,0,0,.28); display:grid; grid-template-rows:auto minmax(0,1fr) auto; z-index:10;
  opacity:0; transform:translateX(28px); visibility:hidden; transition:opacity 160ms cubic-bezier(.4,0,1,1), transform 160ms cubic-bezier(.4,0,1,1), visibility 0s 160ms; }
.area.pushed .sheet { box-shadow:none; }
.sheet.on { opacity:1; transform:none; visibility:visible; transition:opacity 200ms ease-out, transform 300ms cubic-bezier(.16,1,.3,1); }
.sheet.swap .sh-h, .sheet.swap .sh-b, .sheet.swap .sh-f { animation:swapin 140ms ease-out; }
@keyframes swapin { from { opacity:0; } }
.item.sel, .tbl tr.sel td, .card.sel, .rrow.sel { background:var(--surface-2); }
.item.sel .ti a, .tbl tr.sel td.title a { text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--muted); }
.card.sel { border-color:var(--text-2); }
/* a resting bust is a picture of itself */
.bust-still { display:block; width:100%; height:100%; object-fit:cover; }
.bslot.needs::after { content:''; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--warn); opacity:.9; pointer-events:none; }
/* the ring pulses once when the ask arrives, then holds still */
.bslot.needs.arrive::after { animation:needs 1.2s cubic-bezier(.4,0,.2,1) 2; will-change:opacity, transform; }
@keyframes needs { 0%, 100% { opacity:.9; transform:scale(1); } 50% { opacity:.35; transform:scale(.92); } }
.pmenu, .frow.open .gmenu, .popm { animation:pop 140ms cubic-bezier(.16,1,.3,1); transform-origin:top; }
.frow.up .gmenu { transform-origin:bottom; }
.pmenu.flip, .popm.flip { transform-origin:bottom; }
@keyframes pop { from { opacity:0; transform:translateY(-4px) scale(.98); } }
@media (prefers-reduced-motion:reduce) {
  .sheet, .sheet.on { transform:none; }
  .pmenu, .frow.open .gmenu, .popm { animation:fade 120ms ease-out; }
  @keyframes fade { from { opacity:0; } }
  .bslot.needs.arrive::after { animation:none; }
  .scroll.fade { animation:none; }
}
:root[data-theme='light'] .sheet { box-shadow:-18px 0 40px rgba(20,24,32,.12); }
:root[data-theme='light'] .area.pushed .sheet { box-shadow:none; }

.sh-h { padding:14px 16px 12px; border-bottom:1px solid var(--line); }
.sh-top { display:flex; gap:10px; align-items:flex-start; }
.sh-top h3 { margin:0; font-size:14.5px; font-weight:600; flex:1; line-height:1.35; }

.sh-b { overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.msg { font-size:13.5px; line-height:1.5; }
.msg .w { font-size:12px; color:var(--muted); margin-bottom:2px; display:flex; gap:6px; align-items:center; }
.msg.you .bub { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-lg); padding:8px 11px; }
.msg code { font:12px var(--font-mono); background:var(--code-bg); padding:1px 5px; border-radius:4px; }
.earlier { align-self:center; font-size:12px; color:var(--muted); background:none; border:0; cursor:pointer; min-height:28px; }
.pcard { border:1px solid var(--warn-line); background:var(--warn-soft); border-radius:var(--r-lg); padding:11px 12px; }
.pcard b { display:block; font-weight:600; margin-bottom:4px; }
.pcard pre { margin:6px 0 10px; font:12.5px var(--font-mono); background:var(--code-bg); border:1px solid var(--line); border-radius:var(--r); padding:7px 9px; white-space:pre-wrap; }
.pcard p { margin:0; font-size:12.5px; color:var(--text-2); }
.pcard.neutral { border-color:var(--line-strong); background:var(--surface-2); }

<script type="module">
import { createMascot } from '/files/engine.js';
/* A resting bust is its still (see bust() above). The live engine mounts on hover and is thrown away on leave, so 18 rail busts cost nothing at rest. */
const cache = new Map();
const load = id => { if (!cache.has(id)) { const art = id === 'marshal' ? 'relic' : id, per = id === 'marshal' ? 'zealot' : id;
  cache.set(id, Promise.all([fetch('/files/m-' + art + '.json').then(r => { if (!r.ok) throw 0; return r.json(); }), fetch('/files/p-' + per + '.json').then(r => r.json())])); }
